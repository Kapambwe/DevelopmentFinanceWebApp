<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevelopmentFinanceWebApp</title>
    <script>
        (function () {
            var path = window.location.pathname;
            var search = window.location.search || "";
            var hash = window.location.hash || "";
            var target = "/DevelopmentFinanceWebApp/" + "?redirect=" + encodeURIComponent(path + search + hash);
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
